syntax = "proto3";

package datagen.sample;

message Event {
  string id = 1;
  Customer customer = 2;
  int32 age = 3;
  // A decimal as text keeps every digit.
  string amount = 4;
  // Microseconds since the Unix epoch.
  int64 created_at = 5;
  Status status = 6;
  repeated string tags = 7;
  string label = 8;
}

message Customer {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
}

// Symbols match the spec's values case-insensitively.
enum Status {
  ACTIVE = 0;
  INACTIVE = 1;
  BLOCKED = 2;
}
