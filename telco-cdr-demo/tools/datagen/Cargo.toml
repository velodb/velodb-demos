[package]
name = "datagen"
version = "0.2.0"
edition = "2021"
description = "A record generation framework: spec-driven fields, generators, dependency ordering, and text output for piping anywhere"

[[bin]]
name = "datagen"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
handlebars = "6"
rand = "0.8"
rquickjs = "0.6"
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
precise_rate_limiter = "0.3.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util"] }
toml = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
apache-avro = "0.22"
prost = "0.14"
prost-reflect = "0.16"
protox = "0.9"
rdkafka = { version = "0.39", features = ["cmake-build", "ssl-vendored"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"
object_store = { version = "0.14", features = ["aws"] }
arrow = { version = "59", features = ["json"] }
parquet = { version = "59", features = ["async", "arrow"] }
