# REGN — Regeneron Pharmaceuticals (Health Care). Hot reloaded: save this file and the change applies within a second.
symbol      = "REGN"
name        = "Regeneron Pharmaceuticals"
sector      = "Health Care"
start_price = 935.23      # used only when Doris has no price for this symbol yet
weight      = 1.1      # relative chance of being traded; also the seed allocation

# Price engine for this stock (delete a line to use the default in the comment).
trend_step_percent    = 0.08803   # per tick, 0..this % in the trend direction (default 0.01)
noise_percent         = 0.2641   # ± per tick, independent wiggle (default 0.3)
direction_flip_chance = 0.0007711   # per tick; the band edge always flips (default 0.02)

# Temporary override: the quote walks to pinned_price at pin_step_percent per tick and wiggles there.
# Above the pin it falls, below it rises; the [real] band is ignored while pinned. Remove to resume.
# pinned_price     = 1215.80
# pin_step_percent = 0.5   # also the speed a price walks back into a narrowed band

# Real band: what the market does, the price bounces inside it. By default it is derived at start-up
# as anchor ± band_percent, where anchor is the latest price in Doris (else start_price).
band_percent = 0.5

# [real]                   # explicit band instead of band_percent
# min_price = 467.62
# max_price = 1402.85

# [perceived]              # what the trading app believes. Omitted = same as [real].
# min_price = 514.38         # Shift it up and the app buys near the real top;
# max_price = 1543.14         # shift it down and it sells too early.
