[package]
name = "taxi-gen"
version = "0.1.0"
edition = "2021"
description = "Generate a relative-time (offset_ms <= 0) taxi ping history as Parquet for the Doris hyper-search demo"

[dependencies]
arrow = "56"
parquet = "56"
rand = "0.8"
rand_xoshiro = "0.6"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
